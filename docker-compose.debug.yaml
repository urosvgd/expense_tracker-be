services:
  postgres-debug:
    image: postgres:16
    container_name: expense-tracker-postgres-debug
    restart: unless-stopped

    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - expense_tracker_debug_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expense_tracker_debug_data:
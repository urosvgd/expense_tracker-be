spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.devtools.restart.enabled=false

logging.level.root=INFO
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

app.auth.jwt-secret=${JWT_SECRET}

server.shutdown=graceful

# Backend is only reachable through Caddy (bound to 127.0.0.1 in
# docker-compose.yaml), so its X-Forwarded-For header can be trusted to
# resolve the real client IP - needed for AuthRateLimitFilter to key by
# client rather than by Caddy's internal address.
server.forward-headers-strategy=framework